version: 2
builds:
  - main: ./cmd/prb
    binary: prb
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    name_template: "prb_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum: { name_template: checksums.txt }
changelog: { use: github }
